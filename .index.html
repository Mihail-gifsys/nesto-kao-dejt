
<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jedno pitanje za Andrijanu 💛</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #fff0f5, #ffe4ec, #fff8dc);
}

.card {
  width: 90%;
  max-width: 420px;
  padding: 35px 22px;
  text-align: center;
  background: rgba(255,255,255,0.9);
  border-radius: 28px;
  box-shadow: 0 12px 40px rgba(180,100,120,0.18);
  position: relative;
  z-index: 2;
}

h1 {
  color: #d65b83;
  font-size: 27px;
}

p {
  color: #555;
  font-size: 19px;
  line-height: 1.6;
}

.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 18px;
  margin-top: 30px;
  min-height: 55px;
}

button {
  border: none;
  border-radius: 16px;
  padding: 14px 27px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

#yes {
  background: #ffcf33;
  color: #593e00;
  box-shadow: 0 5px 12px #ffcf3355;
}

#no {
  background: #eeeeee;
  color: #555;
  position: relative;
}

#result {
  display: none;
  margin-top: 25px;
  color: #c58a00;
  font-size: 21px;
  font-weight: bold;
  line-height: 1.5;
}

.heart {
  position: fixed;
  top: -50px;
  z-index: 5;
  pointer-events: none;
  animation: fall linear forwards;
}

@keyframes fall {
  0% {
    transform: translateY(-10vh) rotate(0deg) scale(0.6);
    opacity: 0;
  }
  15% {
    opacity: 1;
    transform: translateY(10vh) rotate(25deg) scale(1.2);
  }
  100% {
    transform: translateY(115vh) rotate(360deg) scale(0.8);
    opacity: 0;
  }
}

.small {
  font-size: 13px;
  color: #999;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="card">
  <div style="font-size:45px">💌</div>

  <h1>Zdravo, Andrijana! 💛</h1>

  <p>
    Imam jedno pitanje za tebe...
    <br><br>
    Da li bi išla sa mnom na kafu
    kada budem došao u Šabac? ☕
  </p>

  <div class="buttons">
    <button id="yes" onclick="sayYes()">Da 💛</button>
    <button id="no">Ne 🙈</button>
  </div>

  <div id="result">
    Znala je ova kafa da ima potencijala! 💛🥹
    <br>
    Onda imamo dogovor! ☕💛
  </div>

  <div class="small">Jedno malo pitanje, od nekoga kome bi značilo tvoje „da“. 💛</div>
</div>

<script>
const noButton = document.getElementById("no");
let escaped = false;

function moveNo() {
  if (!escaped) {
    noButton.style.position = "fixed";
    escaped = true;
  }

  const margin = 15;
  const maxX = Math.max(
    margin,
    window.innerWidth - noButton.offsetWidth - margin
  );
  const maxY = Math.max(
    margin,
    window.innerHeight - noButton.offsetHeight - margin
  );

  noButton.style.left =
    (margin + Math.random() * (maxX - margin)) + "px";

  noButton.style.top =
    (margin + Math.random() * (maxY - margin)) + "px";
}

noButton.addEventListener("pointerenter", moveNo);
noButton.addEventListener("touchstart", function(event) {
  event.preventDefault();
  moveNo();
}, { passive: false });

function makeHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = Math.random() > 0.35 ? "💛" : "💛✨";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (22 + Math.random() * 30) + "px";
  heart.style.animationDuration = (2.5 + Math.random() * 2.5) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 5000);
}

function sayYes() {
  document.getElementById("result").style.display = "block";
  noButton.style.display = "none";

  for (let i = 0; i < 65; i++) {
    setTimeout(makeHeart, i * 65);
  }
}
</script>

</body>
</html>
